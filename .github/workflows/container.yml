name: Container

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-scan:
    name: Build, scan, and generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tomattyy/contracts-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: contracts-api:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate CycloneDX SBOM
        id: sbom
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: contracts-api:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        if: ${{ always() && steps.sbom.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: contracts-api-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: contracts-api:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "contracts-api:${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
