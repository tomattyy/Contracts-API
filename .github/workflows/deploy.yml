name: Deploy to local Kubernetes

on:
  workflow_run:
    workflows:
      - Container
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact branch or tag (for example refs/heads/release/1.2 or refs/tags/v1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-local-kubernetes
  cancel-in-progress: false

jobs:
  prepare-manual:
    name: Build and scan selected revision
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Validate selected branch or tag
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ "$SOURCE_REF" != refs/heads/* && "$SOURCE_REF" != refs/tags/* ]]; then
            echo "Select an exact branch (refs/heads/...) or tag (refs/tags/...)."
            exit 1
          fi
          git check-ref-format "$SOURCE_REF"

      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Record immutable source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build selected revision
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          load: true
          tags: contracts-api:${{ steps.source.outputs.sha }}
          cache-from: type=gha

      - name: Generate CycloneDX SBOM
        id: sbom
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: contracts-api:${{ steps.source.outputs.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM
        if: ${{ always() && steps.sbom.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: contracts-api-manual-sbom-${{ steps.source.outputs.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan selected image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: contracts-api:${{ steps.source.outputs.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned immutable image
        env:
          IMAGE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image="ghcr.io/tomattyy/contracts-api:sha-${IMAGE_SHA}"
          docker tag "contracts-api:${IMAGE_SHA}" "$image"
          docker push "$image"

  deploy:
    name: Deploy verified image to Docker Desktop
    needs: prepare-manual
    if: >-
      ${{
        always() &&
        (
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'develop' &&
            github.event.workflow_run.head_repository.full_name == github.repository
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            needs.prepare-manual.result == 'success'
          )
        )
      }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - docker-desktop
    environment: development

    steps:
      - name: Check out the image source revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-manual.outputs.image_sha || github.event.workflow_run.head_sha }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - name: Verify target cluster and prerequisites
        shell: pwsh
        env:
          GHCR_PRIVATE: ${{ vars.GHCR_PRIVATE }}
        run: |
          $context = kubectl config current-context
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read the configured Kubernetes context."
          }
          if ($context.Trim() -ne "docker-desktop") {
            throw "Refusing to deploy: expected context 'docker-desktop', got '$($context.Trim())'."
          }
          kubectl get namespace contracts
          if ($LASTEXITCODE -ne 0) {
            throw "Namespace 'contracts' must be created and its database secret provisioned before deployment."
          }
          kubectl get secret contracts-api-secrets --namespace contracts
          if ($LASTEXITCODE -ne 0) {
            throw "Secret 'contracts-api-secrets' is required before deployment."
          }
          if ($env:GHCR_PRIVATE -eq "true") {
            kubectl get secret ghcr-pull-secret --namespace contracts
            if ($LASTEXITCODE -ne 0) {
              throw "GHCR_PRIVATE is true but secret 'ghcr-pull-secret' is missing."
            }
          }

      - name: Apply Kubernetes resources
        shell: pwsh
        env:
          GHCR_PRIVATE: ${{ vars.GHCR_PRIVATE }}
          IMAGE_SHA: ${{ github.event_name == 'workflow_dispatch' && needs.prepare-manual.outputs.image_sha || github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $overlay = "k8s"
          if ($env:GHCR_PRIVATE -eq "true") {
            $overlay = "k8s/overlays/private-ghcr"
          }
          kubectl apply -k $overlay
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to apply Kubernetes resources from '$overlay'."
          }
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $imageTag = $env:IMAGE_SHA
          } else {
            $imageTag = $env:IMAGE_SHA.Substring(0, 7)
          }
          $image = "ghcr.io/tomattyy/contracts-api:sha-$imageTag"
          kubectl set image deployment/contracts-api api=$image --namespace contracts
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to set the API image to '$image'."
          }

      - name: Wait for workloads to become ready
        shell: pwsh
        run: |
          kubectl rollout status statefulset/postgres --namespace contracts --timeout=5m
          if ($LASTEXITCODE -ne 0) {
            throw "PostgreSQL did not become ready."
          }
          kubectl rollout status deployment/redis --namespace contracts --timeout=5m
          if ($LASTEXITCODE -ne 0) {
            throw "Redis did not become ready."
          }
          kubectl rollout status deployment/contracts-api --namespace contracts --timeout=5m
          if ($LASTEXITCODE -ne 0) {
            throw "The API deployment did not become ready."
          }
