apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: contracts-api
  labels:
    app.kubernetes.io/name: contracts-api
    app.kubernetes.io/part-of: contracts-api
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: contracts-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
